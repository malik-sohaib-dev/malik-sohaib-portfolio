    </linearGradient>
  </defs>
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="bar" x="6.5" y="8.5" width="19" height="4.5" rx="2.25" />
  <rect class="bar" x="10.5" y="14.25" width="11" height="4.5" rx="2.25" />
  <rect class="bar" x="6.5" y="20" width="15" height="4.5" rx="2.25" />
