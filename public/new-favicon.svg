<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg {
      fill: url(#markBg);
    }
    .bar {
      fill: #010409;
    }
    @media (prefers-color-scheme: light) {
      .bg {
        fill: #ffffff;
        stroke: rgb(15 23 42 / 0.12);
        stroke-width: 1;
      }
